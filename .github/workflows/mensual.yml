# Cada día 1 de mes: revisa cierres y ubica (ubicar.py), actualiza mercados (mercados.py)
# y descubre sitios nuevos por reseñas (descubrir.py). Todo con tope mensual gratuito de Google.
name: Revisión mensual
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1 * *'
concurrency:
  group: escribir-repo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mensual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Ubicar y revisar cierres
        continue-on-error: true
        run: python3 tools/ubicar.py
      - name: Mercados gastronómicos
        continue-on-error: true
        run: python3 tools/mercados.py
      - name: Descubrir sitios nuevos por reseñas
        continue-on-error: true
        run: python3 tools/descubrir.py
      - name: Guardar cambios
        run: |
          for f in index.html nuevos.json mercados.json tools/*.json tools/*.txt; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "renta-bot"
          git config user.email "renta-bot@users.noreply.github.com"
          git commit -m "Revisión mensual: cierres, mercados y sitios nuevos"
          git pull --rebase -q origin main
          git push
