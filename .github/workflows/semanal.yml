# Cada lunes: restaurantes, coctelerías y shishas de la Comunidad de Madrid con ≥4,8★ y ≥400 reseñas → nuevos.json
name: Sitios top cada lunes
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        env:
          REPETIR: "0"
        run: tools/guardar.sh "Sitios top de la semana (≥4,8★ y ≥400 reseñas)" "python3 tools/semanal.py" nuevos.json tools/google_uso.json
