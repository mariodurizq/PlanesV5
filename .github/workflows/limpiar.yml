# Verifica «Dónde comer» contra OpenStreetMap (a mano desde Actions o al cambiar el script)
name: Limpiar Dónde comer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/limpiar_comer.py']
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        run: tools/guardar.sh "Dónde comer verificado contra OpenStreetMap" "python3 tools/limpiar_comer.py" comer-offline.json tools/comer_eliminados.json
