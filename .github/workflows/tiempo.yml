# Cada mañana: previsión de 7 días (Open-Meteo, sin clave)
name: Tiempo para los planes
on:
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        run: tools/guardar.sh "Previsión del tiempo actualizada" "python3 tools/tiempo.py" tiempo.json
