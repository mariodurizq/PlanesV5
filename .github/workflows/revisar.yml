# Repaso de la lista: zonas por límites oficiales (OpenStreetMap), coordenadas sospechosas, duplicados. Sin Google.
name: Repasar la lista de sitios
on:
  workflow_dispatch:
  push:
    paths: ['tools/revisar.py']
  schedule:
    - cron: '17 5 15 * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        run: tools/guardar.sh "Repaso de la lista de sitios" "python3 tools/revisar.py" index.html tools/revision.md
