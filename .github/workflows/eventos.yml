# Agenda real de Madrid: se descarga cada mañana de datos.madrid.es y se guarda en eventos.json
name: Actualizar eventos
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['tools/eventos.py']
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  eventos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        run: tools/guardar.sh "Agenda de eventos actualizada" "python3 tools/eventos.py" eventos.json
