# Cada día 1 de mes: revisa cierres y ubica (ubicar.py), actualiza mercados (mercados.py)
# Todo con tope mensual gratuito de Google.
name: Revisión mensual
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1 * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mensual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        env:
          REPETIR: "0"
        run: tools/guardar.sh "Revisión mensual: cierres y mercados" "python3 tools/ubicar.py; python3 tools/mercados.py || true" index.html mercados.json tools/ultima_ubicacion.txt tools/google_uso.json
