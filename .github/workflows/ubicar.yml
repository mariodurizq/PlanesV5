# Calcula las coordenadas reales de los sitios (OpenStreetMap) y las guarda en index.html.
# Se lanza sola al cambiar tools/ubicar.py o tools/ubicar.trigger, o a mano desde la pestaña Actions.
name: Ubicar sitios en el mapa
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/ubicar.trigger']
concurrency:
  group: escribir-repo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ubicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ubicar
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: python3 tools/ubicar.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "renta-bot"
          git config user.email "renta-bot@users.noreply.github.com"
          for f in index.html tools/*.json tools/*.txt; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Ubicaciones reales actualizadas (OpenStreetMap + Google)"
          git pull --rebase -q origin main
          git push
