# Cada jueves: revisa webs y fotos de los sitios (sin Google)
name: Revisar webs y fotos
on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 4'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        run: tools/guardar.sh "Revisión semanal de webs y fotos" "python3 tools/enlaces.py" index.html tools/ultima_revision_enlaces.txt
