# Calcula las coordenadas reales de los sitios (OpenStreetMap) y las guarda en index.html.
# Se lanza sola al cambiar tools/ubicar.py o tools/ubicar.trigger, o a mano desde la pestaña Actions.
name: Ubicar sitios en el mapa
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ubicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        env:
          REPETIR: "0"
        run: tools/guardar.sh "Ubicaciones reales actualizadas (OpenStreetMap + Google)" "python3 tools/ubicar.py" index.html tools/ultima_ubicacion.txt tools/google_uso.json
