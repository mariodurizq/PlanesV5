# Cada miércoles: horarios de apertura desde OpenStreetMap (sin Google)
name: Horarios semanales
on:
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * 3'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar y guardar
        run: tools/guardar.sh "Horarios actualizados desde OpenStreetMap" "python3 tools/horarios.py" index.html nuevos.json
