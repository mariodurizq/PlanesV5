# Cada miércoles: horarios de apertura desde OpenStreetMap (sin Google)
name: Horarios semanales
on:
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * 3'
concurrency:
  group: escribir-repo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/horarios.py
      - name: Guardar cambios
        run: |
          for f in index.html nuevos.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "renta-bot"
          git config user.email "renta-bot@users.noreply.github.com"
          git commit -m "Horarios actualizados desde OpenStreetMap"
          git pull --rebase -q origin main
          git push
